[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/tug-core",
  "crates/tug-http",
  "crates/tug-service",
  "crates/tug-torrent",
  "crates/tug-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Tug contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
